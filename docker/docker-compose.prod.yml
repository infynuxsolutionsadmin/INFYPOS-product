services:
  postgres:
    image: postgres:17-alpine
    container_name: infypos-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_NAME:-infypos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-infypos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infypos-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: infypos-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pass}@postgres:5432/${DB_NAME:-infypos}?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      RESET_PASSWORD_SECRET: ${RESET_PASSWORD_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    networks:
      - infypos-network

volumes:
  postgres_data:
    name: infypos_prod_postgres_data

networks:
  infypos-network:
    name: infypos_prod_network
    driver: bridge
